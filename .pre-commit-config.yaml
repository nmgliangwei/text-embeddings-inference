repos:
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: docs/source/basic_tutorials/launcher.md
  # -------------------------- Gitleaks 本地离线二进制扫描 --------------------------
  - repo: local
    hooks:
      - id: gitleaks-offline-scan
        name: Gitleaks Secret Scan(Local Binary)
        entry: ./gitleaks
        language: system
        pass_filenames: true
        args:
          - protect
          - --verbose
          - --redact
          - --config=pre-commit/.gitleaks.toml
        stages: [pre-commit]
