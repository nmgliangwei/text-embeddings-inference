name: docker-build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-910b:
    name: 构建昇腾910B ubuntu
    runs-on: [ubuntu-latest, arm64, large]
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up QEMU/Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_NAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.910b.ubuntu
          build-args: |
            CANN_VERSION=9.0.0
          push: true
          tags: |
            quay.io/liangwei/mis-tei:latest
            quay.io/liangwei/mis-tei:26.0.2