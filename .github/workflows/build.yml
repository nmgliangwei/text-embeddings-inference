name: docker-build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-multi-arch:
    name: Build amd64 & arm64 images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_NAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.910b.ubuntu
          platforms: linux/amd64,linux/arm64
          build-args: |
            CANN_VERSION=9.0.0
          push: true
          tags: |
            quay.io/liangwei/mis-tei:910b-latest
            quay.io/liangwei/mis-tei:26.0.2-910b-ubuntu22.04-py3.11